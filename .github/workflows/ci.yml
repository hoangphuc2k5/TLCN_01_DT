name: CI

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ExpressJS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpressJS/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend test suite
        run: npm test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ReactJS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReactJS/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend policy tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  e2e:
    name: Playwright E2E (local fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ReactJS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReactJS/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend fixture dependencies
        working-directory: ExpressJS
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite with MongoDB fixture
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ReactJS/playwright-report
            ReactJS/test-results
          if-no-files-found: ignore
